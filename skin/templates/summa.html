<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" 
        crossorigin="anonymous">
  <style>
    body {
      background-image: url('https://s1.gifyu.com/images/SOFdf.gif');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: 'Arial', sans-serif;
      color: #333;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.9); 
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      margin: 40px auto;
    }

    h1, h3 {
      color: #333;
      font-weight: 700;
    }

    .btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-control-file {
      border: 2px dashed #ddd;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
    }

    .link-section {
      margin-top: 20px;
    }

    .link-section a {
      display: inline-block;
      padding: 10px 20px;
      color: #007bff;
      font-weight: 600;
      text-decoration: none;
      border: 2px solid #007bff;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .link-section a:hover {
      background-color: #007bff;
      color: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #080808;
    }

    .image-preview {
      display: none;
      margin-top: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    #imagePreview img {
      max-width: 100%;
      max-height: 300px;
      border-radius: 10px;
    }
  </style>

  <title>Skin Cancer Detection by AV</title>
</head>

<body>
  <div class="container">
    <h1 class="text-center">Skin Cancer Detection</h1>
    <h1 class="text-center" style="color: #007bff;">by AV</h1>

    <h3 class="text-center">Upload Your Skin Image</h3>

    <form method="POST" enctype="multipart/form-data" action="/showresult">
      <div class="form-group">
        <input type="file" class="form-control-file" name="pic" onchange="readURL(this);" required>
      </div>
      <div class="text-center">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>

    <div class="image-preview" id="imagePreview"></div>

    <div class="link-section text-center">
      <a href="https://skincareaware.blogspot.com/2024/10/skin-cancer-detection-using-machine.html" target="_blank">Read the Full Blog</a>
      <a href="https://colab.research.google.com/drive/1kkP2r1Lhu3jPSLg-7nmU4SA8IBD5FN1w" target="_blank">Check the Code</a>
    </div>
  </div>

  <footer class="mt-5">
    <p>© 2024 Skin Cancer Detection Project. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf" 
          crossorigin="anonymous"></script>
  
  <script>
    function readURL(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        reader.onload = function(e) {
          var imagePreview = document.getElementById('imagePreview');
          imagePreview.style.display = 'block';
          imagePreview.innerHTML = '<img src="' + e.target.result + '" alt="Selected Image">';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
  </script>
</body>

</html>
